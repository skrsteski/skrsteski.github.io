<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  {{ if .IsHome }}<meta name="google-site-verification" content="nDGf-DIKrRrLSC2f21oYXodK4dP2YM1YGyDz46BBJG8" />{{ end }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Google+Sans:400,500,600,700|Noto+Sans:400,500,600,700" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v={{ now.Unix }}">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a href="/" class="nav-name{{ if .IsHome }} active{{ end }}">stefan krsteski</a>
      <div class="nav-right">
        <a href="/cv/"{{ if eq .RelPermalink "/cv/" }} class="active"{{ end }}>cv</a>
        <a href="/publications/"{{ if eq .RelPermalink "/publications/" }} class="active"{{ end }}>publications</a>
        <a href="/projects/"{{ if eq .RelPermalink "/projects/" }} class="active"{{ end }}>projects</a>
        <!-- <a href="/blog/">blog</a> -->
      </div>
    </div>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    <footer></footer>
  </div>
</body>
</html>
