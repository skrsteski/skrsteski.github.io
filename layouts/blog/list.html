{{ define "main" }}
<h1>Blog</h1>
{{ $posts := .Pages }}
{{ if $posts }}
<ul class="blog-list">
  {{ range $posts }}
  <li>
    <div class="post-title"><a href="{{ .Permalink }}">{{ .Title }}</a></div>
    <div class="post-date">{{ .Date.Format "January 2, 2006" }}</div>
    {{ with .Params.summary }}<div class="post-summary">{{ . }}</div>{{ end }}
  </li>
  {{ end }}
</ul>
{{ else }}
<p style="color: var(--text-secondary); font-size: 0.95rem;">No posts yet. Check back soon!</p>
{{ end }}
{{ end }}
